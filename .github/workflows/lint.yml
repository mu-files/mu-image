name: Lint

on:
  pull_request:
  push:
    branches: [main, dev-branch]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Ruff check
        run: ruff check

      - name: Ruff format
        run: ruff format --check
