# Portable engine op catalog (SSOT) — public muimg.
# Location: muimg/engines/catalog/ops.yaml
#
# This file defines the portable op interface (names, attrs, I/O).
# Engine providers consume it to implement compatible dispatch / kernels.
#
# Regenerate the public Python API:
#   python -m muimg.engines.tools.gen_ops
#   (writes muimg/engines/ops.py)
#
# inputs/outputs: unary ops for now.
#   channels: <int> | any | same
#     - inputs: int or any
#     - outputs: int or same (same = copy input 0)
#   dtype matches input 0 unless outputs.dtype is set.
#   height/width/origin match input 0 unless outputs.geometry is set.
#   geometry: <policy> — named emit-meta policy (not attr inspection).
#     Codegen wires geometry: foo → graph._out_meta_foo (implement the fn in graph.py).

version: 1

ops:
  - name: sub_scalar
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32
        count: 1

  - name: mul_scalar
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32
        count: 1

  # ROI crop: emit meta via geometry: crop (_out_meta_crop); native span execute.
  - name: crop
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: crop
    attrs:
      - key: x
        type: i32
        count: 1
      - key: y
        type: i32
        count: 1
      - key: w
        type: i32
        count: 1
      - key: h
        type: i32
        count: 1
      - key: reset_origin
        type: bool
        count: 1
        optional: true

  # TIFF/EXIF orientation 1–8: emit meta via geometry: orientation; native tile execute.
  - name: orientation
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: orientation
    attrs:
      - key: orientation
        type: i32
        count: 1

  - name: bilinear_demosaic
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1

  # Hamilton–Adams by default (halo 3, G ring). fast=true is OpenCV EA:
  # axis-pick green + bilinear chroma, halo 1, single pass. RGB clamped to [0, 1].
  - name: ea_demosaic
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1
      - key: fast
        type: bool
        count: 1
        optional: true

  - name: matrix_3x3
    inputs:
      - channels: 3
    outputs:
      - channels: same
    attrs:
      - key: matrix
        type: f32_array
        count: 9

  - name: lut
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: lut
        type: f32_array
        count: 0  # any length >= 1

  - name: convert_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: clip_max
        type: f32
        count: 1

  - name: mono_lut
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: lut
        type: f32_array
        count: 0
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1

  - name: transform_color
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: input_lut
        type: f32_array
        count: 0
        optional: true
      - key: matrix
        type: f32_array
        count: 9
        optional: true
      - key: output_lut
        type: f32_array
        count: 0
        optional: true
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1
      - key: hue_preserving
        type: bool
        count: 1

  - name: clip_and_transform_color
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: clip_max
        type: f32_array
        count: 3
      - key: matrix
        type: f32_array
        count: 9

  - name: normalize_raw
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: samples_per_pixel
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  # DNG HueSatMap with a single value plane (ProfileHueSatMapDims value
  # divisions == 1). The table is indexed by hue and saturation only, so the
  # op is invariant to scaling the input RGB: scale the input by k and the
  # output scales by k, up to the output clamp at 1.0. map_data is the raw
  # DNG table, hue-major within a plane: [hue][sat][3] of
  # (hue_shift_deg, sat_scale, val_scale).
  - name: apply_hue_sat_map
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      # Engine-specific options: JSON object keyed by engine name; engines
      # ignore namespaces they don't own and strictly validate their own.
      # CoreEngine: {"core": {"chroma_lut": false}} forces the bit-faithful
      # DNG bilinear path instead of the default (approximate, ~1.4x faster)
      # chroma-face LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG HueSatMap / LookTable with two or more value planes: the table is
  # indexed by hue, saturation and value, so unlike apply_hue_sat_map the op
  # is not invariant to scaling the input RGB. map_data is the raw DNG table,
  # value-major: [val][hue][sat][3] of (hue_shift_deg, sat_scale, val_scale)
  # — note value is the outermost axis in the data even though it is the
  # third entry of the DNG dims tag.
  - name: apply_hue_sat_val_map
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      - key: val_divs
        type: i32
        count: 1
      # CoreEngine: {"core": {"prism_lut": false}} forces the bit-faithful DNG
      # trilinear path instead of the default (approximate, ~1.5x faster)
      # chroma-face-plus-value prism LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  - name: apply_profile_gain_table_map
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: gains
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: spacing_v
        type: f32
        count: 1
      - key: spacing_h
        type: f32
        count: 1
      - key: origin_v
        type: f32
        count: 1
      - key: origin_h
        type: f32
        count: 1
      - key: num_table_points
        type: i32
        count: 1
      - key: weights
        type: f32_array
        count: 5
      - key: gamma
        type: f32
        count: 1
      - key: exposure_weight_gain
        type: f32
        count: 1

  - name: fix_vignette
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: params
        type: f64_array
        count: 0
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1

  - name: warp_rectilinear
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: radial_params
        type: f64_array
        count: 0
      - key: num_planes
        type: i32
        count: 1
      - key: num_coeffs
        type: i32
        count: 1
      - key: tangential_params
        type: f64_array
        count: 0
        optional: true
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1
      - key: use_bicubic
        type: bool
        count: 1

  - name: apply_gain_map
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: gain_values
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: map_planes
        type: i32
        count: 1
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: spacing_v
        type: f64
        count: 1
      - key: spacing_h
        type: f64
        count: 1
      - key: origin_v
        type: f64
        count: 1
      - key: origin_h
        type: f64
        count: 1

  - name: apply_gain_map_cfa
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: gain_values
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: map_planes
        type: i32
        count: 1
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: spacing_v
        type: f64
        count: 1
      - key: spacing_h
        type: f64
        count: 1
      - key: origin_v
        type: f64
        count: 1
      - key: origin_h
        type: f64
        count: 1

  - name: apply_flat_gain_map
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: gain_map
        type: f32_array
        count: 0
      - key: gain_h
        type: i32
        count: 1
      - key: gain_w
        type: i32
        count: 1

  - name: map_polynomial
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: coefficients
        type: f32_array
        count: 0
      - key: degree
        type: i32
        count: 1

  - name: fix_bad_pixels_constant
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: uint16
    attrs:
      - key: constant
        type: i32
        count: 1
      - key: bayer_phase
        type: i32
        count: 1
