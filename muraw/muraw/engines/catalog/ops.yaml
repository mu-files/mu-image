# The master copy of this file lives in mu-image-engine/kernels/portable_ops.yaml.
# Edit that file. copy_to_public.sh installs this copy.

# Regenerate the public Python API:
#   python -m muraw.engines.tools.gen_ops
#   (writes muraw/engines/ops.py)
#
# inputs/outputs: one output. Zero or one input (fill has none).
#   channels: <int> | any | same
#     - inputs: int or any
#     - outputs: int or same (same = copy input 0)
#   dtype matches input 0 unless outputs.dtype is set.
#   height/width/origin match input 0 unless outputs.geometry is set.
#   geometry: <policy> — named emit-meta policy (not attr inspection).
#     Codegen wires geometry: foo → graph._out_meta_foo (implement the fn in graph.py).
#
# Op properties. Each is false unless written as `true` on the op, and none
# is implied by another property or by the op name.
#   requires_2d: the op needs rows. It reads rows above or below the one it
#     writes, or it uses the row coordinate itself (distance from an optical
#     center, a gain grid indexed by row, a CFA pattern's row phase). It
#     cannot run on a one-row (N,) array.
#   is_cfa: the input is a color filter array mosaic: one channel, where each
#     pixel holds one color sample in a repeating pattern such as Bayer RGGB.
#     Requires inputs[0].channels: 1 and requires_2d: true.
#   is_rgb: the input is three-channel RGB. Requires inputs[0].channels: 3.
#   is_cfa and is_rgb are never both true; with neither, the op takes any
#   layout.
# Naming rule, checked by both generators against the properties: an is_cfa
# op's name starts with cfa_, an is_rgb op's name starts with rgb_, and no
# other op uses either prefix.

version: 1

# Shared attr value sets. A string attr references one with `enum: <name>`;
# gen_ops inlines the values into the generated attr spec for validation.
enums:
  pad_mode:
    - constant
    - edge
    - symmetric
    - reflect

ops:
  - name: sub_scalar
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32
        count: 1

  - name: mul_scalar
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32
        count: 1

  # Constant dest: no input. Shape/dtype live on the output array.
  - name: fill
    inputs: []
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0

  # ROI view: emit meta via geometry: view (_out_meta_view); native span execute.
  - name: view
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: view
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: width
        type: i32
        count: 1
      - key: height
        type: i32
        count: 1
      - key: reset_origin
        type: bool
        count: 1
        optional: true
      # False (ActiveArea): dest is clipped to the view window. True: dest
      # may sit past the view window.
      - key: oob_valid
        type: bool
        count: 1
        optional: true
      # Dest channel i reads src_channels[i]. Omit for identity 0..C-1.
      - key: src_channels
        type: i32_array
        count: 0
        optional: true
      # Dest row y reads source row top + y * row_step. Omit for 1.
      # Step -1 is a flip along this axis.
      - key: row_step
        type: i32
        count: 1
        optional: true
      # Dest column x reads source column left + x * col_step. Omit for 1.
      - key: col_step
        type: i32
        count: 1
        optional: true

  # Grow height and width. channel_before / channel_after add constant
  # channels; that requires mode constant. constant_values is the four
  # spatial edges, or those four plus the channel-before and channel-after
  # fills (prepare accepts length 4 or 6).
  - name: pad
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: pad
    attrs:
      - key: top
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: channel_before
        type: i32
        count: 1
        optional: true
      - key: channel_after
        type: i32
        count: 1
        optional: true
      - key: mode
        type: string
        count: 1
        optional: true
        enum: pad_mode
      - key: constant_values
        type: f32_array
        count: 0
        optional: true

  # Repeat the source. row_reps, col_reps, and channel_reps are the
  # counts after NumPy's right-aligned padding with leading 1s. Each
  # must be >= 1. The public mi.tile parses reps; this op takes the counts.
  - name: tile
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: tile
    attrs:
      - key: row_reps
        type: i32
        count: 1
      - key: col_reps
        type: i32
        count: 1
      - key: channel_reps
        type: i32
        count: 1

  # TIFF/EXIF orientation 1–8: emit meta via geometry: orientation.
  - name: orientation
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: orientation
    attrs:
      - key: orientation
        type: i32
        count: 1

  - name: cfa_bilinear_demosaic
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1

  # Hamilton–Adams by default (halo 3, G ring). fast=true is OpenCV EA:
  # axis-pick green + bilinear chroma, halo 1, single pass. RGB clamped to [0, 1].
  - name: cfa_ea_demosaic
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1
      - key: fast
        type: bool
        count: 1
        optional: true

  - name: rgb_matrix_3x3
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: same
    attrs:
      - key: matrix
        type: f32_array
        count: 9

  - name: lut
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: lut
        type: f32_array
        count: 0  # any length >= 1

  - name: convert_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1
      - key: src_bits
        type: i32
        count: 1
        optional: true
      - key: dst_bits
        type: i32
        count: 1
        optional: true
      - key: clip_max
        type: f32
        count: 1
        optional: true

  - name: cast_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1

  - name: mono_lut
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: lut
        type: f32_array
        count: 0
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1

  - name: rgb_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: input_lut
        type: f32_array
        count: 0
        optional: true
      - key: matrix
        type: f32_array
        count: 9
        optional: true
      - key: output_lut
        type: f32_array
        count: 0
        optional: true
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1
      - key: hue_preserving
        type: bool
        count: 1

  - name: rgb_clip_and_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: clip_max
        type: f32_array
        count: 3
      - key: matrix
        type: f32_array
        count: 9

  # DNG linearization: subtract BlackLevel (a black_repeat_rows ×
  # black_repeat_cols pattern per sample, plus the optional per-column and
  # per-row deltas), then scale by WhiteLevel. The DNG SDK applies the same
  # tags to CFA and LinearRaw images, so cfa_normalize_raw and
  # normalize_raw take the same attrs and share one kernel.
  # normalize_raw is for LinearRaw, where the channel count is the DNG
  # SamplesPerPixel (1 for monochrome, 3 for RGB, or more).
  - name: cfa_normalize_raw
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  - name: normalize_raw
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  # DNG HueSatMap with a single value plane (ProfileHueSatMapDims value
  # divisions == 1). The table is indexed by hue and saturation only, so the
  # op is invariant to scaling the input RGB: scale the input by k and the
  # output scales by k, up to the output clamp at 1.0. map_data is the raw
  # DNG table, hue-major within a plane: [hue][sat][3] of
  # (hue_shift_deg, sat_scale, val_scale).
  - name: rgb_apply_hue_sat_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      # Engine-specific options: JSON object keyed by engine name; engines
      # ignore namespaces they don't own and strictly validate their own.
      # CoreEngine: {"core": {"chroma_lut": false}} forces the bit-faithful
      # DNG bilinear path instead of the default (approximate, ~1.4x faster)
      # chroma-face LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG HueSatMap / LookTable with two or more value planes: the table is
  # indexed by hue, saturation and value, so unlike rgb_apply_hue_sat_map the op
  # is not invariant to scaling the input RGB. map_data is the raw DNG table,
  # value-major: [val][hue][sat][3] of (hue_shift_deg, sat_scale, val_scale)
  # — note value is the outermost axis in the data even though it is the
  # third entry of the DNG dims tag.
  - name: rgb_apply_hue_sat_val_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      - key: val_divs
        type: i32
        count: 1
      # CoreEngine: {"core": {"prism_lut": false}} forces the bit-faithful DNG
      # trilinear path instead of the default (approximate, ~1.5x faster)
      # chroma-face-plus-value prism LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  - name: rgb_apply_profile_gain_table_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: gains
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: spacing_v
        type: f32
        count: 1
      - key: spacing_h
        type: f32
        count: 1
      - key: origin_v
        type: f32
        count: 1
      - key: origin_h
        type: f32
        count: 1
      - key: num_table_points
        type: i32
        count: 1
      - key: weights
        type: f32_array
        count: 5
      - key: gamma
        type: f32
        count: 1
      - key: exposure_weight_gain
        type: f32
        count: 1

  - name: fix_vignette
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: params
        type: f64_array
        count: 0
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1

  - name: warp_rectilinear
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: radial_params
        type: f64_array
        count: 0
      - key: num_planes
        type: i32
        count: 1
      - key: num_coeffs
        type: i32
        count: 1
      - key: tangential_params
        type: f64_array
        count: 0
        optional: true
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1
      - key: use_bicubic
        type: bool
        count: 1

  - name: rgb_apply_gain_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: gain_values
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: map_planes
        type: i32
        count: 1
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: spacing_v
        type: f64
        count: 1
      - key: spacing_h
        type: f64
        count: 1
      - key: origin_v
        type: f64
        count: 1
      - key: origin_h
        type: f64
        count: 1

  - name: cfa_apply_gain_map
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: gain_values
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: map_planes
        type: i32
        count: 1
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: spacing_v
        type: f64
        count: 1
      - key: spacing_h
        type: f64
        count: 1
      - key: origin_v
        type: f64
        count: 1
      - key: origin_h
        type: f64
        count: 1

  - name: apply_flat_gain_map
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: gain_map
        type: f32_array
        count: 0
      - key: gain_h
        type: i32
        count: 1
      - key: gain_w
        type: i32
        count: 1

  - name: map_polynomial
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: coefficients
        type: f32_array
        count: 0
      - key: degree
        type: i32
        count: 1

  - name: cfa_fix_bad_pixels_constant
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: uint16
    attrs:
      - key: constant
        type: i32
        count: 1
      - key: bayer_phase
        type: i32
        count: 1
