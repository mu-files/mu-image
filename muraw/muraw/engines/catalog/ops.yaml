        count: 0
        optional: true

  # Resample the rows and columns of a 2D image to out_rows x out_cols.
  # Each channel and each frame is resampled the same way.
  #
  # scale_rows and scale_cols are output pixels per input pixel. Both are
  # set or neither is; without them the scale of an axis is its output
  # length over its input length. An output pixel is placed by its center:
  # source row (dest_row + 0.5) / scale_rows - 0.5, and the same for
  # columns. With scale set the inverse map may pass the edge of the input.
  #
  # interpolation, auto when absent:
  #   nearest   the source sample nearest that point; a point halfway
  #             between two samples takes the later one. So dest row y
  #             reads source row floor((y + 0.5) / scale_rows), which
  #             with size alone is floor((2 y + 1) in_rows /
  #             (2 out_rows)).
  #   bilinear  the 2 x 2 interpolant.
  #   area      on an axis that shrinks, output pixel col covers source
  #             columns [col / scale_cols, (col + 1) / scale_cols); each
  #             source pixel contributes its overlap, and the sum is divided
  #             by the window's length. The same for rows. On an axis that
  #             grows it is nearest.
  #   auto      per axis: area when the scale is below 1, bilinear when it
  #             is above 1, and a copy of the axis when it is exactly 1.
  #
  # A sample read outside the source's readable rect (its canvas when its
  # oob_valid is true, else the source itself) takes the pad in mode,
  # reflect when absent, as the pad op computes it; constant fills with
  # constant_values, one value or one per channel (one per frame on a
  # (C, H, W) array), 0 when absent. The result has the source's dtype; an
  # integer result is rounded to nearest and saturated.
  - name: resize
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: resize
    attrs:
      - key: out_rows
        type: i32
        count: 1
      - key: out_cols
        type: i32
        count: 1
      - key: scale_rows
        type: f64
        count: 1
        optional: true
      - key: scale_cols
        type: f64
        count: 1
        optional: true
      - key: interpolation
        type: string
        count: 1
        optional: true
        enum: resize_interpolation
      - key: mode
        type: string
        count: 1
        optional: true
        enum: pad_mode
      - key: constant_values
        type: f32_array
        count: 0
        optional: true

  # TIFF/EXIF orientation 1–8: emit meta via geometry: orientation.
  - name: orientation
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: orientation
    attrs:
      - key: orientation
        type: i32
        count: 1

  # Permute the three axes, as np.transpose(x, axes): output axis i is input
  # axis axes[i]. Input and output may differ in frame_axis, so this is
  # the op that moves an array between CHW and packed. Only the graph
  # builder emits it: identity emits nothing, and the permutations that are
  # an orientation or a view emit those ops.
  - name: transpose
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: transpose
    attrs:
      - key: axes
        type: i32_array
        count: 3

  # The same samples, in the same order, read as another shape, as
  # np.reshape(x, shape). shape is the output's buffer shape: 1 to 3 axes
  # (count 0 is variable), with the same sample count as the input. The
  # dtype does not change.
  - name: reshape
    inputs:
      - channels: any
    outputs:
      - geometry: reshape
    attrs:
      - key: shape
        type: i32_array
        count: 0

  # Bayer CFA to RGB. algorithm picks the method (default ea):
  #   bilinear  DNG SDK bilinear, halo 1.
  #   ea        Hamilton–Adams, halo 3. RGB clamped to [0, 1].
  #   ea_fast   OpenCV EA: axis-pick green and bilinear chroma, halo 1.
  #             RGB clamped to [0, 1].
  # cfa_pattern names the colours of the 2×2 block at the first sample of
  # the input's canvas, so a crop that keeps its parent's canvas keeps its
  # parent's pattern.
  - name: cfa_demosaic
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1
      - key: algorithm
        type: string
        count: 1
        optional: true
        enum: demosaic_algorithm
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # NumPy's x @ matrix on each pixel's channels. matrix has one row per
  # input channel and `columns` values per row, row-major. The output has
  # `columns` channels. Up to 32 input and 32 output channels. Computed in
  # float32; integer results round to nearest and saturate.
  - name: matmul
    inputs:
      - channels: any
    outputs:
      - channels:
          from_attr: columns
    attrs:
      - key: matrix
        type: f32_array
        count: 0  # input channels * columns
      - key: columns
        type: i32
        count: 1

  - name: rgb_matrix_3x3
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: same
    attrs:
      - key: matrix
        type: f32_array
        count: 9

  - name: lut
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: lut
        type: f32_array
        count: 0  # any length >= 1

  - name: convert_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1
      - key: src_bits
        type: i32
        count: 1
        optional: true
      - key: dst_bits
        type: i32
        count: 1
        optional: true
      - key: clip_max
        type: f32
        count: 1
        optional: true

  # Each sample stored in dest_dtype, as the same number. Unlike
  # convert_dtype there is no range scale and no clip. A float stored as
  # an integer is truncated toward zero, and a value outside the
  # destination range saturates to it: NaN and a negative become 0, and
  # an infinity becomes the destination maximum. An integer keeps its
  # value, saturated when the destination is a narrower integer. A float
  # stored as a float keeps its value in the destination precision,
  # including NaN and inf. A numeric sample becomes bool when it is
  # nonzero: 0 and float -0 are false, and every other value, including
  # NaN and inf, is true. A bool sample becomes 0 or 1 in the destination
  # dtype.
  - name: cast_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1

  - name: mono_lut
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: lut
        type: f32_array
        count: 0
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1

  - name: rgb_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: input_lut
        type: f32_array
        count: 0
        optional: true
      - key: matrix
        type: f32_array
        count: 9
        optional: true
      - key: output_lut
        type: f32_array
        count: 0
        optional: true
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1
      - key: hue_preserving
        type: bool
        count: 1

  - name: rgb_clip_and_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: clip_max
        type: f32_array
        count: 3
      - key: matrix
        type: f32_array
        count: 9

  # DNG linearization: subtract BlackLevel (a black_repeat_rows ×
  # black_repeat_cols pattern per sample, plus the optional per-column and
  # per-row deltas), then scale by WhiteLevel. The DNG SDK applies the same
  # tags to CFA and LinearRaw images, so cfa_normalize_raw and
  # rgb_normalize_raw take the same attrs and share one kernel.
  # rgb_normalize_raw is for three-channel LinearRaw; monochrome LinearRaw
  # uses cfa_normalize_raw, whose kernel does not depend on the CFA
  # pattern. The black pattern and the deltas start at the first sample of
  # the input's canvas, so a crop that keeps its parent's canvas keeps its
  # parent's black.
  - name: cfa_normalize_raw
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  - name: rgb_normalize_raw
    is_rgb: true
    requires_2d: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  # DNG HueSatMap with a single value plane (ProfileHueSatMapDims value
  # divisions == 1). The table is indexed by hue and saturation only, so the
  # op is invariant to scaling the input RGB: scale the input by k and the
  # output scales by k, up to the output clamp at 1.0. map_data is the raw
  # DNG table, hue-major within a plane: [hue][sat][3] of
  # (hue_shift_deg, sat_scale, val_scale).
  - name: rgb_apply_hue_sat_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG HueSatMap / LookTable with two or more value planes: the table is
  # indexed by hue, saturation and value, so unlike rgb_apply_hue_sat_map the op
  # is not invariant to scaling the input RGB. map_data is the raw DNG table,
  # value-major: [val][hue][sat][3] of (hue_shift_deg, sat_scale, val_scale)
  # — note value is the outermost axis in the data even though it is the
  # third entry of the DNG dims tag.
  - name: rgb_apply_hue_sat_val_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      - key: val_divs
        type: i32
        count: 1
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG ProfileGainTableMap: each RGB pixel times a gain looked up in a
  # gain table, input 1, of shape (points_v, points_h, table_points).
  # The table's rows and columns are a grid over x's canvas; its third axis is indexed by the pixel's weight,
  # weights[0] * r + weights[1] * g + weights[2] * b
  #   + weights[3] * min(r, g, b) + weights[4] * max(r, g, b),
  # times exposure_weight_gain, clamped to [0, 1], and raised to gamma.
  # The gain is the table interpolated trilinearly at the pixel's grid
  # position and weight. A pixel's position is its center as a fraction
  # of the canvas, (col + 0.5) / canvas_width and (row + 0.5) /
  # canvas_height; table sample (0, 0) is at origin_x, origin_y and its
  # neighbors spacing_x and spacing_y on, in the same fractions, as DNG
  # gives them. Past the grid's first or last column or row a pixel takes
  # that column's or row's gains. On a crop the op gives the crop of the
  # op on the image the crop was cut from. clamp is none, max_one or
  # zero_one (DNG without overrange support clamps to [0, 1]). The result
  # has x's dtype.
  - name: rgb_apply_gain_table_map
    is_rgb: true
    requires_2d: true
    inputs:
      - channels: 3
      - channels: any
    outputs:
      - channels: 3
    attrs:
      - key: origin_x
        type: f64
        count: 1
      - key: origin_y
        type: f64
        count: 1
      - key: spacing_x
        type: f64
        count: 1
      - key: spacing_y
        type: f64
        count: 1
      - key: weights
        type: f32_array
        count: 5
      - key: gamma
        type: f64
        count: 1
      - key: exposure_weight_gain
        type: f64
        count: 1
      - key: clamp
        type: string
        count: 1
        optional: true
        enum: gain_clamp
      - key: engine_opts
        type: string
        count: 1
        optional: true

  - name: warp_rectilinear
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: radial_params
        type: f64_array
        count: 0
      - key: num_planes
        type: i32
        count: 1
      - key: num_coeffs
        type: i32
        count: 1
      - key: tangential_params
        type: f64_array
        count: 0
        optional: true
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1
      - key: use_bicubic
        type: bool
        count: 1

  # DNG GainMap: samples of x times a low-resolution gain map, input 1,
  # interpolated bilinearly to each pixel. The map is
  # (points_v, points_h) or (points_v, points_h, map_planes); plane p, a
  # channel or the frame of a (C, H, W) array, reads map plane
  # min(p, map_planes - 1). Every position is on x's canvas, so on a crop
  # the op gives the crop of the op on the image the crop was cut from.
  # Map sample (0, 0) is at canvas column map_x0 and row map_y0, and its
  # neighbors map_spacing_x and map_spacing_y pixels on; a DNG origin,
  # measured from pixel centers, is origin_h * canvas_width - 0.5. Past the
  # map's first or last column or row a pixel takes that column's or row's
  # gain. Only samples in the area (top, left, bottom, right on the
  # canvas; an empty area, or none, is the whole canvas), at row_pitch and
  # col_pitch from its top-left corner, on planes start_plane ..
  # start_plane + num_planes - 1 (every plane when not set) change; the
  # rest are copied. clamp is none, max_one (at most 1, as DNG GainMap
  # clamps) or zero_one. The result has x's dtype: a uint16 code is
  # multiplied by the gain, rounded, and saturated at 65535 whatever clamp
  # is.
  - name: apply_gain_map
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: map_x0
        type: f64
        count: 1
      - key: map_y0
        type: f64
        count: 1
      - key: map_spacing_x
        type: f64
        count: 1
      - key: map_spacing_y
        type: f64
        count: 1
      - key: top
        type: i32
        count: 1
        optional: true
      - key: left
        type: i32
        count: 1
        optional: true
      - key: bottom
        type: i32
        count: 1
        optional: true
      - key: right
        type: i32
        count: 1
        optional: true
      - key: start_plane
        type: i32
        count: 1
        optional: true
      - key: num_planes
        type: i32
        count: 1
        optional: true
      - key: row_pitch
        type: i32
        count: 1
        optional: true
      - key: col_pitch
        type: i32
        count: 1
        optional: true
      - key: clamp
        type: string
        count: 1
        optional: true
        enum: gain_clamp
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG MapPolynomial: samples in the area (top, left, bottom, right; 0 and
  # 0 mean the whole axis), at row_pitch and col_pitch from its top-left
  # corner, on planes start_plane .. start_plane + num_planes - 1, become
  # c0 + c1 x + ... + c_degree x^degree clamped to [-1, 1]. coefficients
  # holds degree + 1 values for every plane, or num_planes * (degree + 1),
  # one set per plane. A plane is a channel, or a frame of a (C, H, W)
  # array.
  - name: map_polynomial
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: coefficients
        type: f32_array
        count: 0
      - key: degree
        type: i32
        count: 1
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG FixBadPixelsConstant on a Bayer mosaic: a sample equal to constant
  # becomes the mean of its same-colour neighbours that are not: the four
  # diagonal ones of a green site, the four at distance 2 on the row and
  # column of a red or blue site. On uint16, as in the SDK, constant is cut
  # to 16 bits and the mean is rounded; on float32 constant is compared as
  # given and the mean is not rounded. bayer_phase names the colour of the
  # first sample of the array's canvas as the DNG spec defines it (0 red,
  # 1 green on a red row, 2 green on a blue row, 3 blue; the SDK reads it
  # the other way round), so a crop that keeps its parent's canvas keeps
  # its parent's phase. The image edge is the array's readable rect: an
  # oob_valid view's parent, else the array itself. A neighbour past it is
  # replaced as the SDK does, by the sample of the same colour in the two
  # outer rows or columns. A sample with no good neighbour keeps the
  # constant.
  - name: cfa_fix_bad_pixels_constant
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
    attrs:
      - key: constant
        type: i32
        count: 1
      - key: bayer_phase
        type: i32
        count: 1
