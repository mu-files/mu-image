# The master copy of this file lives in mu-image-engine/kernels/portable_ops.yaml.
# Edit that file. copy_to_public.sh installs this copy.

# Regenerate the public Python API:
#   python -m muraw.engines.tools.gen_ops
#   (writes muraw/engines/ops.py)
#
# inputs/outputs: one output. Any number of inputs (fill has none), one
#   entry per input, in node order.
#   variable: true on the last input entry means a node has that input one
#     or more times, so the op takes a variable number of inputs. Only the
#     last entry may be variable.
#   channels: <int> | any | same | {from_attr: <key>}
#     - inputs: int or any
#     - outputs: int, same (same = copy input 0), or from_attr (the
#       value of the i32 attr <key>)
#   dtype matches input 0 unless outputs.dtype is set.
#   height/width/origin match input 0 unless outputs.geometry is set.
#   geometry: <policy> — named emit-meta policy (not attr inspection).
#     Codegen wires geometry: foo → graph._out_meta_foo (implement the fn in graph.py).
#     A policy builds the whole output meta, so an output with a geometry
#     may leave channels out when the policy decides it (reshape).
#
# Op properties. Each is false unless written as `true` on the op, and none
# is implied by another property or by the op name.
#   requires_2d: the op needs rows. It reads rows above or below the one it
#     writes, or it uses the row coordinate itself (distance from an optical
#     center, a gain grid indexed by row, a CFA pattern's row phase). It
#     cannot run on a one-row (N,) array.
#   is_cfa: the input is a color filter array mosaic: one channel, where each
#     pixel holds one color sample in a repeating pattern such as Bayer RGGB.
#     Requires inputs[0].channels: 1 and requires_2d: true.
#   is_rgb: the input is three-channel RGB. Requires inputs[0].channels: 3.
#   is_cfa and is_rgb are never both true; with neither, the op takes any
#   layout.
#   needs_frame_index: the op must know which frame it is writing. An
#     array is a stack of frames, each a packed (rows, columns, channels)
#     image; an array with frame_axis 0 is one frame per index of axis 0,
#     and any other array is one frame. The
#     engine runs every op one frame at a time, except transpose, which
#     takes every frame in one call. Most ops treat every frame the same
#     and need every array of a node to have the same number of frames;
#     an op with this property instead has per-frame attrs, or reads a
#     different source frame than it writes, so its arrays may have
#     different frame counts. An attr names channels or frames, never both:
#     on an array whose channels are on axis 0, the caller sends the frame
#     attr (dest_frames, src_frames, frame_reps, frame_before and
#     frame_after, per_frame). Excludes is_cfa and is_rgb.
# Naming rule, checked by both generators against the properties: an is_cfa
# op's name starts with cfa_, an is_rgb op's name starts with rgb_, and no
# other op uses either prefix.

version: 1

# Shared attr value sets. A string attr references one with `enum: <name>`;
# gen_ops inlines the values into the generated attr spec for validation.
enums:
  pad_mode:
    - constant
    - edge
    - symmetric
    - reflect
  ramp_along:
    - columns
    - rows
  view_mode:
    - crop_oob_valid
    - crop_oob_invalid
    - crop_reset_canvas
  demosaic_algorithm:
    - bilinear
    - ea
    - ea_fast
  gain_clamp:
    - none
    - max_one
    - zero_one

ops:
  # Arithmetic with a constant: x + value, x - value, x * value, x / value.
  # value holds one number for every sample, or one per channel. With
  # per_frame: true it holds one number per frame instead, used for every
  # channel of that frame. Integer results are rounded to the nearest
  # integer and saturate to the dtype's range. reverse: true computes
  # value - x and value / x.
  - name: add_scalar
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0
      - key: per_frame
        type: bool
        count: 1
        optional: true

  - name: sub_scalar
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0
      - key: per_frame
        type: bool
        count: 1
        optional: true
      - key: reverse
        type: bool
        count: 1
        optional: true

  - name: mul_scalar
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0
      - key: per_frame
        type: bool
        count: 1
        optional: true

  - name: div_scalar
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0
      - key: per_frame
        type: bool
        count: 1
        optional: true
      - key: reverse
        type: bool
        count: 1
        optional: true

  # Arithmetic between two arrays of one dtype: a + b, a - b, a * b,
  # a / b. The inputs broadcast as in NumPy: each input's frames, rows,
  # columns, and channels match the output's, or are 1 and are read at
  # index 0 for every output index. Integer results are rounded to the
  # nearest integer and saturate to the dtype's range. divide has float
  # paths only.
  - name: add
    needs_frame_index: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
        geometry: broadcast
    attrs: []

  - name: subtract
    needs_frame_index: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
        geometry: broadcast
    attrs: []

  - name: multiply
    needs_frame_index: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
        geometry: broadcast
    attrs: []

  - name: divide
    needs_frame_index: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
        geometry: broadcast
    attrs: []

  # The base (input 0) with sources written over it, in input order, so a
  # later source overwrites an earlier one. Source i is input i + 1.
  #
  # Each per-source parameter is a table and a _source list that names the
  # source of each entry, in the table's order. A source has at most one
  # entry in a table, and the entries fill it end to end; the order of the
  # entries does not change which source is drawn over which.
  #
  # Each source is placed by exactly one of:
  # - by_position: entry (top, left), as
  #   out[top:top + h, left:left + w] = source. The source must fit
  #   inside the base.
  # - by_row_col: entry rows then cols, h dest rows and then w dest
  #   columns, as out[np.ix_(rows, cols)] = source. Every index is inside
  #   the base, and a later duplicate in one list replaces an earlier one.
  #
  # dest_channels: entry the dest channel of each source channel. A source
  # with no entry writes channel c to dest channel c. A repeated dest
  # channel takes the later source channel, as in NumPy. dest_frames does
  # the same for frames. A source less precise than the base is converted
  # to the base's dtype.
  - name: composite
    needs_frame_index: true
    inputs:
      - channels: any
      - channels: any
        variable: true
    outputs:
      - channels: same
    attrs:
      - key: by_position
        type: i32_array
        count: 0
        optional: true
      - key: by_position_source
        type: i32_array
        count: 0
        optional: true
      - key: by_row_col
        type: i32_array
        count: 0
        optional: true
      - key: by_row_col_source
        type: i32_array
        count: 0
        optional: true
      - key: dest_channels
        type: i32_array
        count: 0
        optional: true
      - key: dest_channels_source
        type: i32_array
        count: 0
        optional: true
      - key: dest_frames
        type: i32_array
        count: 0
        optional: true
      - key: dest_frames_source
        type: i32_array
        count: 0
        optional: true

  # Constant dest: no input. Shape/dtype live on the output array.
  - name: fill
    inputs: []
    outputs:
      - channels: same
    attrs:
      - key: value
        type: f32_array
        count: 0

  # start + index * step, computed in float32 and then stored as the dest
  # dtype. No input. along=columns: one row, one component, the index
  # is the column. along=rows: one component per column, the index is the
  # row. stop, when set, replaces the last sample on that axis.
  - name: ramp
    inputs: []
    outputs:
      - channels: same
    attrs:
      - key: along
        type: string
        count: 1
        enum: ramp_along
      - key: start
        type: f32_array
        count: 0
      - key: step
        type: f32_array
        count: 0
      - key: stop
        type: f32_array
        count: 0
        optional: true

  # ROI view: emit meta via geometry: view (_out_meta_view); native span execute.
  - name: view
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: view
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: width
        type: i32
        count: 1
      - key: height
        type: i32
        count: 1
      # crop_oob_valid (the default) keeps the input's canvas, and dest may
      # sit past the view window. crop_oob_invalid keeps the input's canvas
      # and clips dest to the view window. crop_reset_canvas makes the view
      # window the canvas, at origin (0, 0), and clips dest to it.
      - key: mode
        type: string
        count: 1
        optional: true
        enum: view_mode
      # Dest channel i reads src_channels[i]. Omit for identity 0..C-1.
      - key: src_channels
        type: i32_array
        count: 0
        optional: true
      # Dest frame i reads src_frames[i]. Omit for identity 0..F-1.
      - key: src_frames
        type: i32_array
        count: 0
        optional: true
      # Dest row y reads source row top + y * row_step. Omit for 1.
      # Step -1 is a flip along this axis.
      - key: row_step
        type: i32
        count: 1
        optional: true
      # Dest column x reads source column left + x * col_step. Omit for 1.
      - key: col_step
        type: i32
        count: 1
        optional: true

  # Grow height and width. channel_before / channel_after add constant
  # channels; that requires mode constant. frame_before / frame_after add
  # frames, in any mode. constant_values is the four spatial edges, then
  # the fills before and after the source's channels, then the fills
  # before and after its frames (prepare accepts length 4, 6, or 8; an
  # omitted fill is 0).
  - name: pad
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: pad
    attrs:
      - key: top
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: channel_before
        type: i32
        count: 1
        optional: true
      - key: channel_after
        type: i32
        count: 1
        optional: true
      - key: frame_before
        type: i32
        count: 1
        optional: true
      - key: frame_after
        type: i32
        count: 1
        optional: true
      - key: mode
        type: string
        count: 1
        optional: true
        enum: pad_mode
      - key: constant_values
        type: f32_array
        count: 0
        optional: true

  # Repeat the source. row_reps, col_reps, and channel_reps are the
  # counts after NumPy's right-aligned padding with leading 1s, and
  # frame_reps (1 when omitted) repeats frames. Each must be >= 1. The
  # public mi.tile parses reps; this op takes the counts.
  # row_repeats and col_repeats (1 when omitted) repeat each row and each
  # column in place, as np.repeat, before the copies of row_reps and
  # col_reps: dest column x reads source column
  # (x % (width * col_repeats)) // col_repeats, and rows likewise.
  - name: tile
    needs_frame_index: true
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: tile
    attrs:
      - key: row_reps
        type: i32
        count: 1
      - key: col_reps
        type: i32
        count: 1
      - key: channel_reps
        type: i32
        count: 1
      - key: frame_reps
        type: i32
        count: 1
        optional: true
      - key: row_repeats
        type: i32
        count: 1
        optional: true
      - key: col_repeats
        type: i32
        count: 1
        optional: true

  # Gather rows and columns by index, as np.take along each axis: dest
  # row y reads source row row_indices[y], and dest column x reads source
  # column col_indices[x]. A missing list is the identity. Every index is
  # in range of the source; indices may repeat, skip, and reorder.
  - name: take
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: take
    attrs:
      - key: row_indices
        type: i32_array
        count: 0
        optional: true
      - key: col_indices
        type: i32_array
        count: 0
        optional: true

  # TIFF/EXIF orientation 1–8: emit meta via geometry: orientation.
  - name: orientation
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: orientation
    attrs:
      - key: orientation
        type: i32
        count: 1

  # Permute the three axes, as np.transpose(x, axes): output axis i is input
  # axis axes[i]. Input and output may differ in frame_axis, so this is
  # the op that moves an array between CHW and packed. Only the graph
  # builder emits it: identity emits nothing, and the permutations that are
  # an orientation or a view emit those ops.
  - name: transpose
    inputs:
      - channels: any
    outputs:
      - channels: same
        geometry: transpose
    attrs:
      - key: axes
        type: i32_array
        count: 3

  # The same samples, in the same order, read as another shape, as
  # np.reshape(x, shape). shape is the output's buffer shape: 1 to 3 axes
  # (count 0 is variable), with the same sample count as the input. The
  # dtype does not change.
  # The engine does not copy for this op: the output is the input's
  # storage read as the new shape. The node is a chain boundary.
  - name: reshape
    inputs:
      - channels: any
    outputs:
      - geometry: reshape
    attrs:
      - key: shape
        type: i32_array
        count: 0

  # Bayer CFA to RGB. algorithm picks the method (default ea):
  #   bilinear  DNG SDK bilinear, halo 1.
  #   ea        Hamilton–Adams, halo 3. RGB clamped to [0, 1].
  #   ea_fast   OpenCV EA: axis-pick green and bilinear chroma, halo 1.
  #             RGB clamped to [0, 1].
  # engine_opts {"core": {"neon": false}} forces the scalar loops of ea and
  # ea_fast.
  - name: cfa_demosaic
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 3
    attrs:
      - key: cfa_pattern
        type: string
        count: 1
      - key: algorithm
        type: string
        count: 1
        optional: true
        enum: demosaic_algorithm
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # NumPy's x @ matrix on each pixel's channels. matrix has one row per
  # input channel and `columns` values per row, row-major. The output has
  # `columns` channels. Up to 32 input and 32 output channels. Computed in
  # float32; integer results round to nearest and saturate.
  - name: matmul
    inputs:
      - channels: any
    outputs:
      - channels:
          from_attr: columns
    attrs:
      - key: matrix
        type: f32_array
        count: 0  # input channels * columns
      - key: columns
        type: i32
        count: 1

  - name: rgb_matrix_3x3
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: same
    attrs:
      - key: matrix
        type: f32_array
        count: 9

  - name: lut
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: lut
        type: f32_array
        count: 0  # any length >= 1

  - name: convert_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1
      - key: src_bits
        type: i32
        count: 1
        optional: true
      - key: dst_bits
        type: i32
        count: 1
        optional: true
      - key: clip_max
        type: f32
        count: 1
        optional: true

  - name: cast_dtype
    inputs:
      - channels: any
    outputs:
      - channels: same
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: dest_dtype
        type: string
        count: 1

  - name: mono_lut
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: lut
        type: f32_array
        count: 0
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1

  - name: rgb_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype:
          from_attr: dest_dtype
    attrs:
      - key: input_lut
        type: f32_array
        count: 0
        optional: true
      - key: matrix
        type: f32_array
        count: 9
        optional: true
      - key: output_lut
        type: f32_array
        count: 0
        optional: true
      - key: src_bits
        type: i32
        count: 1
      - key: dst_bits
        type: i32
        count: 1
      - key: dest_dtype
        type: string
        count: 1
      - key: hue_preserving
        type: bool
        count: 1

  - name: rgb_clip_and_transform
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: clip_max
        type: f32_array
        count: 3
      - key: matrix
        type: f32_array
        count: 9

  # DNG linearization: subtract BlackLevel (a black_repeat_rows ×
  # black_repeat_cols pattern per sample, plus the optional per-column and
  # per-row deltas), then scale by WhiteLevel. The DNG SDK applies the same
  # tags to CFA and LinearRaw images, so cfa_normalize_raw and
  # rgb_normalize_raw take the same attrs and share one kernel.
  # rgb_normalize_raw is for three-channel LinearRaw; monochrome LinearRaw
  # uses cfa_normalize_raw, whose kernel does not depend on the CFA
  # pattern.
  - name: cfa_normalize_raw
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  - name: rgb_normalize_raw
    is_rgb: true
    requires_2d: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: black_level
        type: f32_array
        count: 0
      - key: black_repeat_rows
        type: i32
        count: 1
      - key: black_repeat_cols
        type: i32
        count: 1
      - key: white_level
        type: f32_array
        count: 0
      - key: black_delta_h
        type: f32_array
        count: 0
        optional: true
      - key: black_delta_v
        type: f32_array
        count: 0
        optional: true
      - key: linearization_table
        type: i32_array
        count: 0
        optional: true

  # DNG HueSatMap with a single value plane (ProfileHueSatMapDims value
  # divisions == 1). The table is indexed by hue and saturation only, so the
  # op is invariant to scaling the input RGB: scale the input by k and the
  # output scales by k, up to the output clamp at 1.0. map_data is the raw
  # DNG table, hue-major within a plane: [hue][sat][3] of
  # (hue_shift_deg, sat_scale, val_scale).
  - name: rgb_apply_hue_sat_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      # Engine-specific options: JSON object keyed by engine name; engines
      # ignore namespaces they don't own and strictly validate their own.
      # CoreEngine: {"core": {"chroma_lut": false}} forces the bit-faithful
      # DNG bilinear path instead of the default (approximate, ~1.4x faster)
      # chroma-face LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG HueSatMap / LookTable with two or more value planes: the table is
  # indexed by hue, saturation and value, so unlike rgb_apply_hue_sat_map the op
  # is not invariant to scaling the input RGB. map_data is the raw DNG table,
  # value-major: [val][hue][sat][3] of (hue_shift_deg, sat_scale, val_scale)
  # — note value is the outermost axis in the data even though it is the
  # third entry of the DNG dims tag.
  - name: rgb_apply_hue_sat_val_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: map_data
        type: f32_array
        count: 0
      - key: hue_divs
        type: i32
        count: 1
      - key: sat_divs
        type: i32
        count: 1
      - key: val_divs
        type: i32
        count: 1
      # CoreEngine: {"core": {"prism_lut": false}} forces the bit-faithful DNG
      # trilinear path instead of the default (approximate, ~1.5x faster)
      # chroma-face-plus-value prism LUT.
      - key: engine_opts
        type: string
        count: 1
        optional: true

  - name: rgb_apply_profile_gain_table_map
    is_rgb: true
    inputs:
      - channels: 3
    outputs:
      - channels: 3
        dtype: float32
    attrs:
      - key: gains
        type: f32_array
        count: 0
      - key: points_v
        type: i32
        count: 1
      - key: points_h
        type: i32
        count: 1
      - key: spacing_v
        type: f32
        count: 1
      - key: spacing_h
        type: f32
        count: 1
      - key: origin_v
        type: f32
        count: 1
      - key: origin_h
        type: f32
        count: 1
      - key: num_table_points
        type: i32
        count: 1
      - key: weights
        type: f32_array
        count: 5
      - key: gamma
        type: f32
        count: 1
      - key: exposure_weight_gain
        type: f32
        count: 1

  # DNG FixVignetteRadial: every sample is multiplied by
  # 1 + k0 r^2 + k1 r^4 + ... and clamped to [0, 1], with params holding
  # k0, k1, ... (at most five are used). r is the distance from the optical
  # center to the pixel's center, as the DNG SDK measures it, divided by
  # the distance from the optical center to the farthest corner of the
  # input's canvas. center_x and center_y are fractions of the
  # canvas's width and height from its top-left corner, so on a crop they
  # still place the center in the image the crop was cut from.
  - name: fix_vignette
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: params
        type: f64_array
        count: 0
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1
      # The gain is computed at every map_spacing-th column and row of the
      # canvas and interpolated in between; a power of 2, 8 when not set.
      # 1 computes it at every pixel.
      - key: map_spacing
        type: i32
        count: 1
        optional: true
      - key: engine_opts
        type: string
        count: 1
        optional: true

  - name: warp_rectilinear
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: radial_params
        type: f64_array
        count: 0
      - key: num_planes
        type: i32
        count: 1
      - key: num_coeffs
        type: i32
        count: 1
      - key: tangential_params
        type: f64_array
        count: 0
        optional: true
      - key: center_x
        type: f64
        count: 1
      - key: center_y
        type: f64
        count: 1
      - key: use_bicubic
        type: bool
        count: 1

  # DNG GainMap: samples of x times a low-resolution gain map, input 1,
  # interpolated bilinearly to each pixel. The map is float32,
  # (points_v, points_h) or (points_v, points_h, map_planes); plane p, a
  # channel or the frame of a (C, H, W) array, reads map plane
  # min(p, map_planes - 1). Every position is on x's canvas, so on a crop
  # the op gives the crop of the op on the image the crop was cut from.
  # Map sample (0, 0) is at canvas column map_x0 and row map_y0, and its
  # neighbors map_spacing_x and map_spacing_y pixels on; a DNG origin,
  # measured from pixel centers, is origin_h * canvas_width - 0.5. Past the
  # map's first or last column or row a pixel takes that column's or row's
  # gain. Only samples in the area (top, left, bottom, right on the
  # canvas; an empty area, or none, is the whole canvas), at row_pitch and
  # col_pitch from its top-left corner, on planes start_plane ..
  # start_plane + num_planes - 1 (every plane when not set) change; the
  # rest are copied. clamp is none, max_one (at most 1, as DNG GainMap
  # clamps) or zero_one. x is uint16, float16 or float32, and the result
  # has its dtype: a uint16 code is multiplied by the gain, rounded, and
  # saturated at 65535 whatever clamp is; float16 is multiplied in
  # float16. engine_opts {"core": {"neon": false}} forces the scalar loop.
  - name: apply_gain_map
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: map_x0
        type: f64
        count: 1
      - key: map_y0
        type: f64
        count: 1
      - key: map_spacing_x
        type: f64
        count: 1
      - key: map_spacing_y
        type: f64
        count: 1
      - key: top
        type: i32
        count: 1
        optional: true
      - key: left
        type: i32
        count: 1
        optional: true
      - key: bottom
        type: i32
        count: 1
        optional: true
      - key: right
        type: i32
        count: 1
        optional: true
      - key: start_plane
        type: i32
        count: 1
        optional: true
      - key: num_planes
        type: i32
        count: 1
        optional: true
      - key: row_pitch
        type: i32
        count: 1
        optional: true
      - key: col_pitch
        type: i32
        count: 1
        optional: true
      - key: clamp
        type: string
        count: 1
        optional: true
        enum: gain_clamp
      # At least the largest gain the map holds; a uint16 input then
      # multiplies by a fixed-point gain instead of in float32.
      - key: max_gain
        type: f64
        count: 1
        optional: true
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG MapPolynomial: samples in the area (top, left, bottom, right; 0 and
  # 0 mean the whole axis), at row_pitch and col_pitch from its top-left
  # corner, on planes start_plane .. start_plane + num_planes - 1, become
  # c0 + c1 x + ... + c_degree x^degree clamped to [-1, 1]. coefficients
  # holds degree + 1 values for every plane, or num_planes * (degree + 1),
  # one set per plane. A plane is a channel, or a frame of a (C, H, W)
  # array. float16 is mapped in float16; uint16 and float32 in float32.
  # engine_opts {"core": {"neon": false}} forces the scalar loops, and
  # {"core": {"force_float16": true}} maps uint16 and float32 in float16
  # too.
  - name: map_polynomial
    needs_frame_index: true
    requires_2d: true
    inputs:
      - channels: any
    outputs:
      - channels: same
    attrs:
      - key: top
        type: i32
        count: 1
      - key: left
        type: i32
        count: 1
      - key: bottom
        type: i32
        count: 1
      - key: right
        type: i32
        count: 1
      - key: start_plane
        type: i32
        count: 1
      - key: num_planes
        type: i32
        count: 1
      - key: row_pitch
        type: i32
        count: 1
      - key: col_pitch
        type: i32
        count: 1
      - key: coefficients
        type: f32_array
        count: 0
      - key: degree
        type: i32
        count: 1
      - key: engine_opts
        type: string
        count: 1
        optional: true

  # DNG FixBadPixelsConstant on a uint16 Bayer mosaic: a sample equal to
  # constant becomes the rounded mean of its same-colour neighbours that
  # are not: the four diagonal ones of a green site, the four at distance
  # 2 on the row and column of a red or blue site. bayer_phase names the
  # colour of the first sample of the array's canvas, so a crop that keeps
  # its parent's canvas keeps its parent's phase. Neighbours past the array are
  # read as for cfa_demosaic: an oob_valid view's parent pixels, else the
  # array mirrored at its edge. A sample with no good neighbour keeps the
  # constant.
  - name: cfa_fix_bad_pixels_constant
    is_cfa: true
    requires_2d: true
    inputs:
      - channels: 1
    outputs:
      - channels: 1
        dtype: uint16
    attrs:
      - key: constant
        type: i32
        count: 1
      - key: bayer_phase
        type: i32
        count: 1
